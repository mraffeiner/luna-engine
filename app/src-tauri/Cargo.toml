[package]
name = "LunaEngine"
version = "0.1.0"
description = "Engine to run AI VTuber Luna"
authors = ["Matthias Raffeiner"]
license = "MIT"
repository = "https://github.com/mraffeiner/luna-engine"
default-run = "LunaEngine"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
