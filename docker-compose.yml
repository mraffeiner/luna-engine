# Pin the project name: docker-service follows logs on the luna-engine_default network and only
# controls containers labelled com.docker.compose.project=luna-engine
name: luna-engine

# All ports are bound to 127.0.0.1: the services have no authentication, and Docker's published
# ports bypass host firewalls like ufw. The containers reach each other over the compose network.

services:
  docker-service:
    image: docker-service
    container_name: docker-service
    build: ./services/docker
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  llm-service:
    image: llm-service
    container_name: llm-service
    build: ./services/llm
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./services/llm/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  stt-service:
    image: stt-service
    container_name: stt-service
    build: ./services/stt
    ports:
      - "127.0.0.1:5003:5003"
    env_file:
      - ./services/stt/.env

  kokoro-tts:
    # Upstream Kokoro-FastAPI, pulled from GHCR. tts-service applies pitch on top of it
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.10.0
    container_name: kokoro-tts
    ports:
      - "127.0.0.1:8880:8880"
    env_file:
      - ./services/tts/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  sesame-tts:
    image: sesame-tts
    container_name: sesame-tts
    profiles: [ 'experimental' ]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./services/tts/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  tts-service:
    image: tts-service
    container_name: tts-service
    build: ./services/tts
    ports:
      - "127.0.0.1:5002:5002"
    env_file:
      - ./services/tts/.env
    volumes:
      - ./output/tts:/app/output

  discord-service:
    image: discord-service
    container_name: discord-service
    build: ./services/discord
    ports:
      - "127.0.0.1:5004:5004"
    env_file:
      - ./services/discord/.env

  chat-service:
    image: chat-service
    container_name: chat-service
    build: ./services/chat
    ports:
      - "127.0.0.1:8005:8005"
    env_file:
      - ./services/chat/.env
    volumes:
      # Mount the secrets file (read-only)
      - ./services/chat/youtube_secret.json:/app/youtube_secret.json:ro

  alerts-service:
    image: alerts-service
    container_name: alerts-service
    build: ./services/alerts
    ports:
      - "127.0.0.1:5005:5005"
    env_file:
      - ./services/alerts/.env

  vts-service:
    image: vts-service
    container_name: vts-service
    build: ./services/vts
    ports:
      - "127.0.0.1:5007:5007"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  obs-service:
    image: obs-service
    container_name: obs-service
    build: ./services/obs
    ports:
      - "127.0.0.1:5006:5006"
    env_file:
      - ./services/obs/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  luna-engine:
    image: luna-engine
    container_name: luna-engine
    depends_on:
      - docker-service
      - llm-service
      - stt-service
      - tts-service
      - discord-service
      - chat-service
      - alerts-service
      - vts-service
      - obs-service
    build: ./app
    ports:
      - "127.0.0.1:8080:80"
