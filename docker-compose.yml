services:
  docker-service:
    image: docker-service
    container_name: docker-service
    build: ../docker-service
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ../docker-service/.env

  llm-service:
    image: llm-service
    container_name: llm-service
    build: ../llm-service
    ports:
      - "5001:5001"
    env_file:
      - ../llm-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  stt-service:
    image: stt-service
    container_name: stt-service
    build: ../stt-service
    ports:
      - "5003:5003"
    env_file:
      - ../stt-service/.env

  kokoro-tts:
    image: kokoro-tts
    container_name: kokoro-tts
    ports:
      - "8880:8880"
    env_file:
      - ../stt-service/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  sesame-tts:
    image: sesame-tts
    container_name: sesame-tts
    profiles: [ 'experimental' ]
    ports:
      - "8000:8000"
    env_file:
      - ../stt-service/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  tts-service:
    image: tts-service
    container_name: tts-service
    build: ../tts-service
    ports:
      - "5002:5002"
    env_file:
      - ../tts-service/.env
    volumes:
      - ./output/tts:/app/output

  discord-service:
    image: discord-service
    container_name: discord-service
    build: ../discord-service
    ports:
      - "5004:5004"
    env_file:
      - ../discord-service/.env

  chat-service:
    image: chat-service
    container_name: chat-service
    build: ../chat-service
    ports:
      - "8005:8005"
    env_file:
      - ../chat-service/.env
    volumes:
      # Mount the secrets file (read-only)
      - ../chat-service/youtube_secret.json:/app/youtube_secret.json:ro

  alerts-service:
    image: alerts-service
    container_name: alerts-service
    build: ../alerts-service
    ports:
      - "5005:5005"
    env_file:
      - ../alerts-service/.env

  vts-service:
    image: vts-service
    container_name: vts-service
    build: ../vts-service
    ports:
      - "5007:5007"
    env_file:
      - ../vts-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  obs-service:
    image: obs-service
    container_name: obs-service
    build: ../obs-service
    ports:
      - "5006:5006"
    env_file:
      - ../obs-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  luna-engine:
    image: luna-engine
    container_name: luna-engine
    depends_on:
      - docker-service
      - llm-service
      - stt-service
      - tts-service
      - discord-service
      - chat-service
      - alerts-service
      - vts-service
      - obs-service
    build: .
    ports:
      - "8080:80"
